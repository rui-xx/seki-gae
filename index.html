<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>席替えメーカー</title>
<style>
  :root {
    --bg: #161B22;
    --panel: #1F2630;
    --panel-alt: #242C38;
    --line: #3A4656;
    --amber: #F2A93B;
    --teal: #4FA890;
    --cream: #EDE7DA;
    --faint: #98A3B3;
    --danger: #E2645A;
  }
  * { box-sizing: border-box; }
  html { font-size: 112%; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--cream);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand-badge {
    width: 40px; height: 40px; background: var(--amber); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .brand-label { color: var(--faint); font-size: 0.95rem; letter-spacing: 1px; }
  h1 { font-size: 2.2rem; margin: 6px 0 4px; font-weight: 800; }
  .subtitle { color: var(--faint); font-size: 1.1rem; margin: 0 0 22px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 12px;
    background: transparent; color: var(--faint); font-weight: 700; font-size: 1.05rem;
    border: none; cursor: pointer;
  }
  .tab.active { background: var(--panel); color: var(--amber); }

  .card {
    background: var(--panel); border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .card-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .car-name-input {
    background: transparent; border: none; border-bottom: 2px solid var(--line);
    color: var(--cream); font-size: 1.3rem; font-weight: 700; padding: 6px 0; flex: 1;
    outline: none; min-width: 0;
  }
  .icon-btn { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 1.3rem; padding: 4px; }

  .row-line { display: flex; align-items: center; gap: 10px; padding: 10px 0; flex-wrap: wrap; }
  .row-label { color: var(--faint); font-size: 1.05rem; width: 90px; flex-shrink: 0; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--cream); font-size: 1.3rem; cursor: pointer;
  }
  .stepper .count { font-size: 1.2rem; width: 26px; text-align: center; }
  .row-unit { color: var(--faint); font-size: 1.05rem; }
  .row-remove { margin-left: auto; background: none; border: none; color: var(--faint); font-size: 1.2rem; cursor: pointer; }

  .add-row-btn {
    background: none; border: none; color: var(--teal); font-size: 1.05rem; font-weight: 600;
    display: flex; align-items: center; gap: 6px; cursor: pointer; margin-top: 6px; padding: 4px 0;
  }
  .dashed-btn {
    width: 100%; border: 2px dashed var(--line); border-radius: 16px; background: none;
    color: var(--faint); font-size: 1.1rem; font-weight: 600; padding: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px;
  }
  .hint { color: var(--faint); font-size: 1rem; line-height: 1.6; }

  .person-card { background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .person-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .person-name-input {
    flex: 1; background: transparent; border: none; color: var(--cream);
    font-size: 1.3rem; font-weight: 700; outline: none; min-width: 0;
  }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
    font-size: 1rem; font-weight: 600; border: 1.5px solid var(--line); background: transparent;
    color: var(--faint); cursor: pointer;
  }
  .chip.on-danger { border-color: var(--danger); color: var(--danger); background: rgba(226,100,90,0.14); }
  .chip.on-teal { border-color: var(--teal); color: var(--teal); background: rgba(79,168,144,0.14); }

  .primary-btn {
    width: 100%; background: var(--amber); color: var(--bg); border: none; border-radius: 14px;
    padding: 18px; font-size: 1.2rem; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;
  }
  .primary-btn:disabled { background: var(--line); color: var(--faint); cursor: not-allowed; }
  .ghost-btn {
    width: 100%; background: none; border: 2px solid var(--amber); color: var(--amber);
    border-radius: 14px; padding: 16px; font-size: 1.15rem; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px;
  }

  .car-result { background: var(--panel); border-radius: 18px; padding: 22px; margin-bottom: 16px; }
  .car-result-title { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; margin-bottom: 16px; }
  .seat-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .seat-slot { flex: 1; order: 1; }
  .seat-slot.driver { order: 999; }
  .seat-box {
    border-radius: 12px; min-height: 96px; padding: 14px 10px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .seat-box .seat-label { color: var(--faint); font-size: 1rem; }
  .seat-box .seat-name { font-size: 1.5rem; font-weight: 800; }
  .seat-box.filled { background: var(--panel-alt); border: 2px solid var(--teal); }
  .seat-box.empty { background: transparent; border: 2px dashed var(--line); }
  .seat-box.problem { border-color: var(--danger); }
  .seat-box.problem .seat-name { color: var(--danger); }

  .warning-box {
    background: rgba(226,100,90,0.1); border: 1.5px solid rgba(226,100,90,0.4);
    border-radius: 14px; padding: 16px; margin-bottom: 16px;
  }
  .warning-title { display: flex; align-items: center; gap: 8px; color: var(--danger); font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
  .warning-box p { margin: 4px 0; font-size: 1.02rem; color: var(--cream); }

  .empty-msg { color: var(--faint); font-size: 1.1rem; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
let uid = 0;
const nextId = () => "id_" + (++uid) + "_" + Date.now().toString(36);

let state = {
  tab: "cars",
  cars: [{ id: nextId(), name: "1号車", rows: [2, 3] }],
  people: [{ id: nextId(), name: "", noLicense: false, frontFixed: false }],
  result: null,
};

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSeats(cars) {
  const seats = [];
  cars.forEach((car) => {
    car.rows.forEach((count, rowIdx) => {
      for (let seatIdx = 0; seatIdx < count; seatIdx++) {
        seats.push({
          seatId: car.id + "_" + rowIdx + "_" + seatIdx,
          carId: car.id,
          carName: car.name,
          rowIdx, seatIdx,
          isDriver: rowIdx === 0 && seatIdx === 0,
          isFrontPassenger: rowIdx === 0 && seatIdx === 1,
        });
      }
    });
  });
  return seats;
}

function assignSeats(cars, people) {
  const seats = buildSeats(cars);
  const assignment = {};
  const used = new Set();

  const driverSeats = shuffleArr(seats.filter((s) => s.isDriver));
  const licensed = shuffleArr(people.filter((p) => !p.noLicense));
  let li = 0;
  const unfilledDriverSeats = [];
  driverSeats.forEach((seat) => {
    while (li < licensed.length && used.has(licensed[li].id)) li++;
    if (li < licensed.length) {
      assignment[seat.seatId] = licensed[li].id;
      used.add(licensed[li].id);
      li++;
    } else {
      unfilledDriverSeats.push(seat);
    }
  });

  const frontSeats = shuffleArr(seats.filter((s) => s.isFrontPassenger));
  const frontWanters = shuffleArr(people.filter((p) => p.frontFixed && !used.has(p.id)));
  let fi = 0;
  const unseatedFrontWanters = [];
  frontWanters.forEach((p) => {
    while (fi < frontSeats.length && assignment[frontSeats[fi].seatId]) fi++;
    if (fi < frontSeats.length) {
      assignment[frontSeats[fi].seatId] = p.id;
      used.add(p.id);
      fi++;
    } else {
      unseatedFrontWanters.push(p);
    }
  });

  const remainingSeats = shuffleArr(seats.filter((s) => !assignment[s.seatId]));
  const remainingPeople = shuffleArr(people.filter((p) => !used.has(p.id)));
  const overflowPeople = [];
  remainingSeats.forEach((seat, i) => {
    if (i < remainingPeople.length) {
      assignment[seat.seatId] = remainingPeople[i].id;
      used.add(remainingPeople[i].id);
    }
  });
  if (remainingPeople.length > remainingSeats.length) {
    overflowPeople.push(...remainingPeople.slice(remainingSeats.length));
  }

  return { seats, assignment, warnings: { unfilledDriverSeats, unseatedFrontWanters, overflowPeople } };
}

function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function totalSeats() {
  return state.cars.reduce((sum, c) => sum + c.rows.reduce((a, b) => a + b, 0), 0);
}
function validPeople() {
  return state.people.filter((p) => p.name.trim());
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="brand">
      <div class="brand-badge">🚗</div>
      <span class="brand-label">SEAT SHUFFLE</span>
    </div>
    <h1>席替えメーカー</h1>
    <p class="subtitle">車と乗る人を登録して、席をシャッフル</p>
    <div class="tabs">
      <button class="tab ${state.tab === "cars" ? "active" : ""}" data-tab="cars">🚗 車</button>
      <button class="tab ${state.tab === "people" ? "active" : ""}" data-tab="people">👥 メンバー</button>
      <button class="tab ${state.tab === "result" ? "active" : ""}" data-tab="result">🔀 結果</button>
    </div>
    <div id="tab-content"></div>
  `;
  document.querySelectorAll(".tab").forEach((btn) => {
    btn.addEventListener("click", () => { state.tab = btn.dataset.tab; render(); });
  });
  const content = document.getElementById("tab-content");
  if (state.tab === "cars") content.innerHTML = renderCarsTab();
  else if (state.tab === "people") content.innerHTML = renderPeopleTab();
  else content.innerHTML = renderResultTab();
  attachHandlers();
  if (state.tab === "people") focusRequestedInput();
}

let focusId = null;
function focusRequestedInput() {
  if (focusId) {
    const el = document.querySelector(`[data-person-input="${focusId}"]`);
    if (el) { el.focus(); }
    focusId = null;
  }
}

function renderCarsTab() {
  let html = "";
  state.cars.forEach((car) => {
    html += `<div class="card" data-car="${car.id}">
      <div class="card-title-row">
        <input class="car-name-input" data-car-name="${car.id}" value="${esc(car.name)}" placeholder="車の名前(例: パパの車)" />
        ${state.cars.length > 1 ? `<button class="icon-btn" data-remove-car="${car.id}">🗑️</button>` : ""}
      </div>
      ${car.rows.map((count, rowIdx) => `
        <div class="row-line">
          <span class="row-label">${rowIdx === 0 ? "1列目(前)" : (rowIdx + 1) + "列目"}</span>
          <div class="stepper">
            <button data-row-minus="${car.id}" data-row-idx="${rowIdx}">−</button>
            <span class="count">${count}</span>
            <button data-row-plus="${car.id}" data-row-idx="${rowIdx}">＋</button>
          </div>
          <span class="row-unit">人</span>
          ${car.rows.length > 1 ? `<button class="row-remove" data-row-remove="${car.id}" data-row-idx="${rowIdx}">✕</button>` : ""}
        </div>
      `).join("")}
      <button class="add-row-btn" data-add-row="${car.id}">＋ 列を追加</button>
    </div>`;
  });
  html += `<button class="dashed-btn" data-add-car="1">＋ 車を追加</button>`;
  html += `<p class="hint">合計 ${totalSeats()} 席(1列目の1番目が運転席です。結果画面では右側に表示されます)</p>`;
  return html;
}

function renderPeopleTab() {
  let html = "";
  state.people.forEach((p, idx) => {
    html += `<div class="person-card">
      <div class="person-top">
        <input class="person-name-input" data-person-input="${p.id}" data-person-idx="${idx}" value="${esc(p.name)}" placeholder="名前を入力してEnter" />
        <button class="icon-btn" data-remove-person="${p.id}">🗑️</button>
      </div>
      <div class="chips">
        <button class="chip ${p.noLicense ? "on-danger" : ""}" data-toggle-person="${p.id}" data-flag="noLicense">🚫 免許なし</button>
        <button class="chip ${p.frontFixed ? "on-teal" : ""}" data-toggle-person="${p.id}" data-flag="frontFixed">📌 助手席固定</button>
      </div>
    </div>`;
  });
  html += `<button class="dashed-btn" data-add-person="1">＋ 人を追加</button>`;
  const vp = validPeople().length;
  html += `<button class="primary-btn" data-run-shuffle="1" ${vp === 0 ? "disabled" : ""}>🔀 席替えを実行(${vp}人 / ${totalSeats()}席)</button>`;
  return html;
}

function renderResultTab() {
  if (!state.result) {
    return `<p class="empty-msg">「メンバー」タブから席替えを実行してください</p>`;
  }
  const { seats, assignment, warnings } = state.result;
  const peopleById = Object.fromEntries(state.people.map((p) => [p.id, p]));
  let html = "";

  if (warnings.unfilledDriverSeats.length || warnings.unseatedFrontWanters.length || warnings.overflowPeople.length) {
    html += `<div class="warning-box"><div class="warning-title">⚠️ 確認してください</div>`;
    if (warnings.unfilledDriverSeats.length) {
      html += `<p>運転できる人が足りず、${warnings.unfilledDriverSeats.length}台の運転席が未定です</p>`;
    }
    if (warnings.unseatedFrontWanters.length) {
      html += `<p>助手席が足りず、${warnings.unseatedFrontWanters.map((p) => esc(p.name)).join("・")} は別の席になりました</p>`;
    }
    if (warnings.overflowPeople.length) {
      html += `<p>席が足りず、${warnings.overflowPeople.map((p) => esc(p.name)).join("・")} が乗れませんでした</p>`;
    }
    html += `</div>`;
  }

  const unfilledIds = new Set(warnings.unfilledDriverSeats.map((s) => s.seatId));

  state.cars.forEach((car) => {
    const rows = {};
    seats.filter((s) => s.carId === car.id).forEach((s) => {
      rows[s.rowIdx] = rows[s.rowIdx] || [];
      rows[s.rowIdx].push(s);
    });
    html += `<div class="car-result"><div class="car-result-title">🚗 ${esc(car.name)}</div>`;
    Object.keys(rows).sort((a, b) => a - b).forEach((rowIdx) => {
      html += `<div class="seat-row">`;
      rows[rowIdx].sort((a, b) => a.seatIdx - b.seatIdx).forEach((seat) => {
        const person = peopleById[assignment[seat.seatId]];
        const problem = unfilledIds.has(seat.seatId);
        const label = seat.isDriver ? "運転席" : seat.isFrontPassenger ? "助手席" : (seat.rowIdx + 1) + "列目";
        const cls = problem ? "problem" : person ? "filled" : "empty";
        const name = person ? esc(person.name) : (problem ? "未定" : "空席");
        html += `<div class="seat-slot ${seat.isDriver ? "driver" : ""}">
          <div class="seat-box ${cls}">
            <span class="seat-label">${label}</span>
            <span class="seat-name">${name}</span>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });

  html += `<button class="ghost-btn" data-run-shuffle="1">🔀 もう一度シャッフル</button>`;
  return html;
}

function attachHandlers() {
  document.querySelectorAll("[data-car-name]").forEach((el) => {
    el.addEventListener("input", (e) => {
      const car = state.cars.find((c) => c.id === el.dataset.carName);
      car.name = e.target.value;
    });
  });
  document.querySelectorAll("[data-remove-car]").forEach((el) => {
    el.addEventListener("click", () => {
      state.cars = state.cars.filter((c) => c.id !== el.dataset.removeCar);
      render();
    });
  });
  document.querySelectorAll("[data-add-row]").forEach((el) => {
    el.addEventListener("click", () => {
      const car = state.cars.find((c) => c.id === el.dataset.addRow);
      car.rows.push(2);
      render();
    });
  });
  document.querySelectorAll("[data-row-remove]").forEach((el) => {
    el.addEventListener("click", () => {
      const car = state.cars.find((c) => c.id === el.dataset.rowRemove);
      car.rows.splice(Number(el.dataset.rowIdx), 1);
      render();
    });
  });
  document.querySelectorAll("[data-row-minus]").forEach((el) => {
    el.addEventListener("click", () => {
      const car = state.cars.find((c) => c.id === el.dataset.rowMinus);
      const i = Number(el.dataset.rowIdx);
      car.rows[i] = Math.max(1, car.rows[i] - 1);
      render();
    });
  });
  document.querySelectorAll("[data-row-plus]").forEach((el) => {
    el.addEventListener("click", () => {
      const car = state.cars.find((c) => c.id === el.dataset.rowPlus);
      const i = Number(el.dataset.rowIdx);
      car.rows[i] = car.rows[i] + 1;
      render();
    });
  });
  const addCarBtn = document.querySelector("[data-add-car]");
  if (addCarBtn) addCarBtn.addEventListener("click", () => {
    state.cars.push({ id: nextId(), name: (state.cars.length + 1) + "号車", rows: [2, 3] });
    render();
  });

  document.querySelectorAll("[data-person-input]").forEach((el) => {
    el.addEventListener("input", (e) => {
      const p = state.people.find((p) => p.id === el.dataset.personInput);
      p.name = e.target.value;
    });
    el.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const idx = Number(el.dataset.personIdx);
      const name = state.people[idx].name.trim();
      if (!name) return;
      if (idx === state.people.length - 1) {
        const p = { id: nextId(), name: "", noLicense: false, frontFixed: false };
        state.people.push(p);
        focusId = p.id;
      } else {
        focusId = state.people[idx + 1].id;
      }
      render();
    });
  });
  document.querySelectorAll("[data-remove-person]").forEach((el) => {
    el.addEventListener("click", () => {
      state.people = state.people.filter((p) => p.id !== el.dataset.removePerson);
      render();
    });
  });
  document.querySelectorAll("[data-toggle-person]").forEach((el) => {
    el.addEventListener("click", () => {
      const p = state.people.find((p) => p.id === el.dataset.togglePerson);
      const flag = el.dataset.flag;
      p[flag] = !p[flag];
      render();
    });
  });
  const addPersonBtn = document.querySelector("[data-add-person]");
  if (addPersonBtn) addPersonBtn.addEventListener("click", () => {
    const p = { id: nextId(), name: "", noLicense: false, frontFixed: false };
    state.people.push(p);
    focusId = p.id;
    render();
  });
  document.querySelectorAll("[data-run-shuffle]").forEach((el) => {
    el.addEventListener("click", () => {
      state.result = assignSeats(state.cars, validPeople());
      state.tab = "result";
      render();
    });
  });
}

render();
</script>
</body>
</html>
